<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天小工具測試頁面</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { color: #0070f3; }
    .content {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>聊天小工具測試頁面</h1>
  
  <div class="content">
    <h2>這是一個測試頁面</h2>
    <p>右下角應該會出現聊天按鈕 💬</p>
    <p>點擊按鈕即可開啟聊天視窗</p>
    <p>這個小工具可以嵌入到任何網頁中</p>
  </div>

  <div class="content">
    <h3>使用方式</h3>
    <p>在任何網頁加入以下程式碼：</p>
    <pre><code>&lt;script src="http://localhost:3000/api/chat-widget?tenant_id=demo"&gt;&lt;/script&gt;</code></pre>
    <p>更換不同租戶：</p>
    <pre><code>&lt;script src="http://localhost:3000/api/chat-widget?tenant_id=test"&gt;&lt;/script&gt;</code></pre>
  </div>

  <!-- 載入聊天小工具 (demo 租戶) -->
  <script src="/api/chat-widget?tenant_id=demo"></script>
</body>
</html>
