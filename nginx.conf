server {
    listen 80;

    # Docker 內建 DNS；配合下方變數式 proxy_pass，讓 nginx 每次請求重新解析
    # upstream IP，避免容器重建換 IP 後 nginx 仍打舊位址（502 Connection refused）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin API (must be before /api/ to take priority)
    location /api/admin/ {
        set $upstream_admin http://admin-backend:5001;
        proxy_pass $upstream_admin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Chat API
    location /api/ {
        set $upstream_backend http://backend:5000;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # LINE webhook → 主後端
    location /webhook/line/ {
        set $upstream_backend http://backend:5000;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Tenant images (static)
    location /images/tenants/ {
        alias /usr/share/nginx/images/tenants/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Frontend (Next.js) - catch all
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
