services:
  redis:
    image: redis:latest
    container_name: ai-genie-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: ai-genie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aigenie
      POSTGRES_USER: aigenie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigenie"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ai-genie-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://aigenie:${POSTGRES_PASSWORD}@postgres:5432/aigenie
      - TENANTS_CONFIG_PATH=/app/data/tenants.json
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/data:/app/data
      - ./backend/prompts:/app/prompts
      - ./backend/translations:/app/translations
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.admin
    container_name: ai-genie-admin-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://aigenie:${POSTGRES_PASSWORD}@postgres:5432/aigenie
      - TENANTS_CONFIG_PATH=/app/data/tenants.json
      - CATEGORIES_CONFIG_PATH=/app/data/categories.json
      - UPLOAD_IMAGES_PATH=/app/public/images/tenants
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/data:/app/data
      - ./backend/prompts:/app/prompts
      - ./backend/translations:/app/translations
      - ./backend/data/images/tenants:/app/public/images/tenants
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_ADMIN_API_URL=${NEXT_PUBLIC_ADMIN_API_URL}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
    container_name: ai-genie-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - admin-backend

  nginx:
    image: nginx:alpine
    container_name: ai-genie-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/data/images/tenants:/usr/share/nginx/images/tenants:ro
    depends_on:
      - frontend
      - backend
      - admin-backend

volumes:
  redis-data:
  pg_data:
