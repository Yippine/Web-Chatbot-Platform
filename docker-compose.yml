services:
  redis:
    image: redis:latest
    container_name: ai-genie-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    container_name: ai-genie-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.admin
    container_name: ai-genie-admin-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_ADMIN_API_URL=${NEXT_PUBLIC_ADMIN_API_URL}
    container_name: ai-genie-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - admin-backend

  nginx:
    image: nginx:alpine
    container_name: ai-genie-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - admin-backend

volumes:
  redis-data:
